<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="QuickPDF is a private browser-based PDF utility in early Phase 0 foundation work."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#224248" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="QuickPDF" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>QuickPDF</title>
    <style>
      #quickpdf-boot-fallback {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #f5fafc;
        background:
          radial-gradient(circle at 50% 56%, rgba(0, 194, 168, 0.18), transparent 32rem), #07151b;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        text-align: center;
      }
      #quickpdf-boot-fallback > div {
        max-width: 320px;
      }
      #quickpdf-boot-fallback img {
        width: 76px;
        height: 76px;
        margin-bottom: 20px;
      }
      #quickpdf-boot-fallback strong {
        display: block;
        font-size: 28px;
      }
      #quickpdf-boot-fallback strong span {
        color: #44a1a4;
      }
      #quickpdf-boot-fallback p {
        margin: 16px 0 0;
        color: #b9cbd1;
        font-size: 17px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <section id="quickpdf-boot-fallback" aria-live="polite" aria-labelledby="quickpdf-boot-title">
      <div>
        <img src="/quickpdf-192.png" alt="" />
        <strong id="quickpdf-boot-title">Quick<span>PDF</span></strong>
        <p id="quickpdf-boot-status">Starting QuickPDF...</p>
      </div>
    </section>
    <script>
      window.addEventListener("error", function () {
        var status = document.getElementById("quickpdf-boot-status");
        if (status) status.textContent = "QuickPDF couldn't finish starting.";
      });
      window.addEventListener("unhandledrejection", function () {
        var status = document.getElementById("quickpdf-boot-status");
        if (status) status.textContent = "QuickPDF couldn't finish starting.";
      });
    </script>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
